# A tag v* stages the package on npm through trusted publishing (OIDC), no token.
# The version goes public only after a maintainer approves it with 2FA on npmjs.com
# (package page, Staged Packages). Staging needs npm 11.15+.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@11.15.0
      - run: npm stage publish --provenance
